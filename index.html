<title>클럽 테니스 랭킹</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 하드코트 블루 헤더 밴드 + 탭 아래 한 컬럼. 경기 기록은 전광판 형태의 세트 스코어 */
:root {
  --bg: #f2f5f8;
  --surface: #ffffff;
  --fg: #13283a;
  --muted: #5a6e7f;
  --line: #d4dde5;
  --court: #1d5a8c;
  --court-band: #1d5a8c;
  --on-court: #ffffff;
  --chalk: rgba(255,255,255,.55);
  --ball: #c9d61a;
  --ball-edge: #6f7600;
  --win: #1d7a4c;
  --loss: #b2413d;
  --win-bg: #e3f3ea;
  --loss-bg: #f8e6e5;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1823; --surface: #122334; --fg: #e5edf4; --muted: #8fa3b4; --line: #233a4e;
    --court: #6aaee6; --court-band: #123b5c; --on-court: #f1f6fa; --chalk: rgba(255,255,255,.35);
    --ball: #d8e64c; --ball-edge: #8c9520; --win: #52c48e; --loss: #e57d77;
    --win-bg: #133325; --loss-bg: #3a1c1c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1823; --surface: #122334; --fg: #e5edf4; --muted: #8fa3b4; --line: #233a4e;
  --court: #6aaee6; --court-band: #123b5c; --on-court: #f1f6fa; --chalk: rgba(255,255,255,.35);
  --ball: #d8e64c; --ball-edge: #8c9520; --win: #52c48e; --loss: #e57d77;
  --win-bg: #133325; --loss-bg: #3a1c1c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.band { background: var(--court-band); color: var(--on-court); position: relative; overflow: hidden; }
header.band::before, header.band::after { content: ""; position: absolute; pointer-events: none; border: 2px solid var(--chalk); }
header.band::before { inset: 14px -2px auto 55%; height: 200px; border-right: none; }
header.band::after { left: 77%; top: 14px; bottom: -2px; width: 0; border-width: 0 0 0 2px; }
header .wrap { padding-block: 28px 20px; position: relative; z-index: 1; }
.eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .14em; font-size: 13px; opacity: .8; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 7vw, 48px); line-height: 1; margin: 4px 0 6px; text-wrap: balance; }
.sub { margin: 0; opacity: .85; font-size: 14px; }

nav.tabs { display: flex; gap: 4px; margin-top: 22px; flex-wrap: wrap; }
nav.tabs button { font: 600 15px var(--font-body); background: transparent; color: var(--on-court); border: 1px solid var(--chalk); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--on-court); color: var(--court-band); border-color: var(--on-court); }
nav.tabs button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px; }

main .wrap { padding-block: 24px 48px; display: grid; gap: 20px; }
section[role="tabpanel"] { display: grid; gap: 16px; min-width: 0; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 26px; margin: 0; line-height: 1.1; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.notice { border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; border-radius: 8px; font-size: 14px; }
.notice.warn { border-color: var(--loss); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }

/* 순위표 */
.table-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 560px; }
th, td { padding: 10px 10px; text-align: right; white-space: nowrap; }
th { font: 600 12px var(--font-body); letter-spacing: .06em; color: var(--muted); border-bottom: 1px solid var(--line); text-transform: uppercase; }
td { border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: none; }
th.l, td.l { text-align: left; }
td.rank { font: 700 22px var(--font-display); width: 48px; text-align: center; }
td.name { font-weight: 600; }
td.pts { font: 700 20px var(--font-display); color: var(--court); }
.ballmark { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--ball); border: 1.5px solid var(--ball-edge); vertical-align: 1px; margin-left: 6px; }
.form { display: inline-flex; gap: 3px; }
.wl { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; font: 700 12px var(--font-display); }
.wl.W { background: var(--win-bg); color: var(--win); }
.wl.L { background: var(--loss-bg); color: var(--loss); }
.pos { color: var(--win); } .neg { color: var(--loss); }

/* 폼 */
form { display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
.field { display: grid; gap: 4px; flex: 1 1 180px; min-width: 0; }
label, legend { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="date"], input[type="number"], select {
  font: 500 15px var(--font-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0;
}
fieldset { border: none; padding: 0; margin: 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; cursor: pointer; color: var(--fg); font-weight: 500; font-size: 14px; }
.seg input { accent-color: var(--court); }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; }
.teams .vs { font: 700 20px var(--font-display); color: var(--muted); padding-bottom: 10px; }
.team { display: grid; gap: 8px; min-width: 0; }
@media (max-width: 520px) { .teams { grid-template-columns: 1fr; } .teams .vs { padding: 0; text-align: center; } }
.preview { font-size: 14px; min-height: 22px; }
.preview.err { color: var(--loss); }
.preview.ok { color: var(--win); font-weight: 600; }
.btn { font: 600 15px var(--font-body); background: var(--court); color: var(--surface); border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; justify-self: start; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 5px 10px; font-size: 13px; }
.btn.danger { background: var(--loss); color: var(--surface); padding: 5px 10px; font-size: 13px; }
.toast { font-size: 14px; color: var(--win); min-height: 20px; }

/* 경기 기록: 전광판 */
.day { display: grid; gap: 10px; }
.day h3 { font: 600 15px var(--font-display); letter-spacing: .1em; color: var(--muted); margin: 6px 0 0; text-transform: uppercase; }
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 4px; }
.board .line { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.board .who { min-width: 0; overflow-wrap: anywhere; color: var(--muted); }
.board .line.won .who { color: var(--fg); font-weight: 600; }
.board .sets { display: flex; gap: 4px; font: 600 20px var(--font-display); font-variant-numeric: tabular-nums; }
.board .sets span { width: 26px; text-align: center; color: var(--muted); }
.board .sets span.take { color: var(--fg); }
.board .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 4px; }
.board .meta .acts { display: flex; gap: 6px; }

/* 멤버 */
.members { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.members li { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 6px 4px 12px; }
.members li button { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 50%; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; }
.inline-form input { flex: 1 1 160px; width: auto; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }
@media (prefers-reduced-motion: no-preference) { .board { transition: border-color .15s; } .board:hover { border-color: var(--court); } }
</style>

<header class="band">
  <div class="wrap">
    <div class="eyebrow">Club League · Singles &amp; Doubles</div>
    <h1>클럽 테니스 랭킹</h1>
    <p class="sub">경기 결과를 입력하면 모두의 순위가 바로 갱신됩니다.</p>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-rank" aria-controls="p-rank" aria-selected="true">순위</button>
      <button role="tab" id="tab-add" aria-controls="p-add" aria-selected="false">결과 입력</button>
      <button role="tab" id="tab-log" aria-controls="p-log" aria-selected="false">경기 기록</button>
      <button role="tab" id="tab-mem" aria-controls="p-mem" aria-selected="false">멤버 · 설정</button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="status" class="notice" hidden></div>

    <section role="tabpanel" id="p-rank" aria-labelledby="tab-rank">
      <div>
        <h2>현재 순위</h2>
        <p class="hint" id="rule-hint">승점 → 승률 → 게임 득실차 → 세트 득실차 순으로 정렬합니다.</p>
      </div>
      <div id="standings"></div>
    </section>

    <section role="tabpanel" id="p-add" aria-labelledby="tab-add" hidden>
      <div>
        <h2>경기 결과 입력</h2>
        <p class="hint">팀 A 기준으로 세트 스코어를 적어 주세요. 예: <code>6-4, 3-6, 7-6(5)</code></p>
      </div>
      <div class="panel">
        <form id="match-form" autocomplete="off">
          <div class="row">
            <fieldset class="seg field" id="f-type">
              <legend>경기 유형</legend>
              <label><input type="radio" name="mtype" id="t-single" value="single" checked> 단식</label>
              <label><input type="radio" name="mtype" id="t-double" value="double"> 복식</label>
            </fieldset>
            <div class="field">
              <label for="f-date">날짜</label>
              <input type="date" id="f-date" required>
            </div>
          </div>
          <div class="teams">
            <div class="team">
              <label for="a1">팀 A</label>
              <select id="a1" required></select>
              <select id="a2" class="dbl" aria-label="팀 A 파트너" hidden></select>
            </div>
            <div class="vs">VS</div>
            <div class="team">
              <label for="b1">팀 B</label>
              <select id="b1" required></select>
              <select id="b2" class="dbl" aria-label="팀 B 파트너" hidden></select>
            </div>
          </div>
          <div class="field">
            <label for="f-score">최종 스코어 (팀 A - 팀 B)</label>
            <input type="text" id="f-score" placeholder="6-4, 3-6, 7-5" inputmode="text" required>
          </div>
          <div class="preview" id="preview" aria-live="polite"></div>
          <button class="btn" type="submit" id="save-btn">결과 저장</button>
          <div class="toast" id="toast" aria-live="polite"></div>
        </form>
      </div>
    </section>

    <section role="tabpanel" id="p-log" aria-labelledby="tab-log" hidden>
      <div>
        <h2>경기 기록</h2>
        <p class="hint">최신 경기가 위에 표시됩니다. 굵은 줄이 승리 팀입니다.</p>
      </div>
      <div class="field" style="max-width:280px">
        <label for="log-filter">멤버별 보기</label>
        <select id="log-filter"></select>
      </div>
      <div id="log"></div>
    </section>

    <section role="tabpanel" id="p-mem" aria-labelledby="tab-mem" hidden>
      <div>
        <h2>멤버</h2>
        <p class="hint">경기 기록이 있는 멤버는 삭제할 수 없습니다.</p>
      </div>
      <form class="inline-form" id="member-form">
        <input type="text" id="m-name" placeholder="이름" maxlength="20" aria-label="새 멤버 이름" required>
        <button class="btn" type="submit">멤버 추가</button>
      </form>
      <ul class="members" id="members"></ul>

      <div>
        <h2>승점 규칙</h2>
        <p class="hint">참여를 장려하려면 패배에도 승점을 주세요.</p>
      </div>
      <form class="inline-form" id="settings-form">
        <div class="field" style="flex:0 1 140px">
          <label for="s-win">승리 승점</label>
          <input type="number" id="s-win" min="0" max="10" step="1">
        </div>
        <div class="field" style="flex:0 1 140px">
          <label for="s-loss">패배 승점</label>
          <input type="number" id="s-loss" min="0" max="10" step="1">
        </div>
        <button class="btn" type="submit" style="align-self:end">규칙 저장</button>
      </form>
    </section>
  </div>
</main>

<script src="ranking.js"></script>
<script>
(function () {
  'use strict';
  const R = window.Ranking;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

  const state = {
    db: null, user: null, uid: null, canWrite: true, loaded: { members: false, matches: false },
    members: [], matches: [], settings: Object.assign({}, R.DEFAULT_SETTINGS), names: {}, pendingDelete: null,
  };

  // ---------- 탭 ----------
  const tabs = ['rank', 'add', 'log', 'mem'];
  function showTab(key) {
    tabs.forEach((k) => {
      $('tab-' + k).setAttribute('aria-selected', String(k === key));
      $('p-' + k).hidden = k !== key;
    });
    try { localStorage.setItem('tab', key); } catch (e) {}
  }
  tabs.forEach((k) => $('tab-' + k).addEventListener('click', () => showTab(k)));
  let initial = (location.hash || '').slice(1);
  if (!tabs.includes(initial)) { try { initial = localStorage.getItem('tab') || 'rank'; } catch (e) { initial = 'rank'; } }
  showTab(tabs.includes(initial) ? initial : 'rank');

  function setStatus(msg, warn) {
    const el = $('status');
    el.hidden = !msg; el.textContent = msg || ''; el.classList.toggle('warn', !!warn);
  }

  const memberName = (id) => (state.members.find((m) => m.id === id) || {}).name || '(삭제된 멤버)';
  const teamName = (ids) => ids.map(memberName).join(' · ');

  // ---------- 렌더 ----------
  function renderStandings() {
    const el = $('standings');
    if (!state.loaded.members) { el.innerHTML = '<div class="panel empty">순위를 불러오는 중…</div>'; return; }
    if (!state.members.length) {
      el.innerHTML = '<div class="panel empty"><strong>아직 멤버가 없습니다</strong>“멤버 · 설정” 탭에서 멤버를 추가한 뒤 경기 결과를 입력하면 여기에 순위가 나타납니다.</div>';
      return;
    }
    const rows = R.computeStandings(state.members, state.matches, state.settings);
    const diff = (n) => `<span class="${n > 0 ? 'pos' : n < 0 ? 'neg' : ''}">${n > 0 ? '+' : ''}${n}</span>`;
    el.innerHTML = `<div class="table-scroll"><table>
      <thead><tr><th>순위</th><th class="l">이름</th><th>경기</th><th>승</th><th>패</th><th>승률</th><th>세트</th><th>게임 득실</th><th>승점</th><th class="l">최근 5경기</th></tr></thead>
      <tbody>${rows.map((s) => `<tr>
        <td class="rank">${s.rank}</td>
        <td class="l name">${esc(s.name)}${s.rank === 1 && s.played ? '<span class="ballmark" title="1위"></span>' : ''}</td>
        <td>${s.played}</td><td>${s.wins}</td><td>${s.losses}</td>
        <td>${s.played ? (s.winRate * 100).toFixed(0) + '%' : '–'}</td>
        <td>${s.setsWon}-${s.setsLost}</td>
        <td>${diff(s.gamesWon - s.gamesLost)}</td>
        <td class="pts">${s.points}</td>
        <td class="l"><span class="form">${s.recent.slice().reverse().map((r) => `<span class="wl ${r}">${r}</span>`).join('') || '<span class="hint">–</span>'}</span></td>
      </tr>`).join('')}</tbody></table></div>`;
    $('rule-hint').textContent = `승리 ${state.settings.winPoints}점 · 패배 ${state.settings.lossPoints}점. 승점 → 승률 → 게임 득실차 → 세트 득실차 순으로 정렬합니다.`;
  }

  function fillSelect(sel, placeholder) {
    const keep = sel.value;
    const opts = [`<option value="">${placeholder}</option>`]
      .concat(state.members.map((m) => `<option value="${esc(m.id)}">${esc(m.name)}</option>`));
    sel.innerHTML = opts.join('');
    if (state.members.some((m) => m.id === keep)) sel.value = keep;
  }
  function renderSelects() {
    fillSelect($('a1'), '선수 선택'); fillSelect($('a2'), '파트너 선택');
    fillSelect($('b1'), '선수 선택'); fillSelect($('b2'), '파트너 선택');
    const f = $('log-filter'); const keep = f.value;
    f.innerHTML = '<option value="">전체 멤버</option>' + state.members.map((m) => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('');
    if (state.members.some((m) => m.id === keep)) f.value = keep;
  }

  function renderLog() {
    const el = $('log');
    const filter = $('log-filter').value;
    const list = state.matches
      .filter((m) => !filter || m.teamA.includes(filter) || m.teamB.includes(filter))
      .sort((x, y) => (y.date || '').localeCompare(x.date || '') || (y.createdAt || 0) - (x.createdAt || 0));
    if (!state.loaded.matches) { el.innerHTML = '<div class="panel empty">기록을 불러오는 중…</div>'; return; }
    if (!list.length) {
      el.innerHTML = '<div class="panel empty"><strong>아직 경기 기록이 없습니다</strong>“결과 입력” 탭에서 첫 경기를 기록해 보세요.</div>';
      return;
    }
    const byDay = new Map();
    list.forEach((m) => { if (!byDay.has(m.date)) byDay.set(m.date, []); byDay.get(m.date).push(m); });
    el.innerHTML = [...byDay].map(([date, ms]) => `<div class="day"><h3>${esc(date)}</h3>${ms.map(boardHtml).join('')}</div>`).join('');
  }

  function boardHtml(m) {
    let r; try { r = R.decideWinner(m.sets); } catch (e) { return ''; }
    const line = (ids, side) => {
      const won = r.winner === side;
      const sets = m.sets.map(([a, b]) => {
        const mine = side === 'A' ? a : b, theirs = side === 'A' ? b : a;
        return `<span class="${mine > theirs ? 'take' : ''}">${mine}</span>`;
      }).join('');
      return `<div class="line ${won ? 'won' : ''}"><div class="who">${esc(teamName(ids))}${won ? '<span class="ballmark" title="승리"></span>' : ''}</div><div class="sets">${sets}</div></div>`;
    };
    const by = m.createdBy && state.names[m.createdBy] ? ` · 입력: ${esc(state.names[m.createdBy])}` : '';
    const confirming = state.pendingDelete === m.id;
    const acts = !state.canWrite ? '' : confirming
      ? `<button class="btn danger" data-del-confirm="${esc(m.id)}">삭제 확인</button><button class="btn ghost" data-del-cancel>취소</button>`
      : `<button class="btn ghost" data-del="${esc(m.id)}">삭제</button>`;
    return `<article class="board">${line(m.teamA, 'A')}${line(m.teamB, 'B')}
      <div class="meta"><span>${m.teamA.length > 1 ? '복식' : '단식'}${by}</span><span class="acts">${acts}</span></div></article>`;
  }

  function renderMembers() {
    const used = new Set(state.matches.flatMap((m) => m.teamA.concat(m.teamB)));
    const ul = $('members');
    if (!state.members.length) { ul.innerHTML = '<li class="hint" style="border:none;background:none">아직 멤버가 없습니다. 위에서 이름을 입력해 추가하세요.</li>'; }
    else ul.innerHTML = state.members.map((m) => `<li>${esc(m.name)}${state.canWrite && !used.has(m.id)
      ? `<button type="button" data-rm="${esc(m.id)}" aria-label="${esc(m.name)} 삭제" title="삭제">×</button>` : ''}</li>`).join('');
    $('s-win').value = state.settings.winPoints;
    $('s-loss').value = state.settings.lossPoints;
  }

  function applyWriteState() {
    document.querySelectorAll('#match-form input, #match-form select, #match-form button, #member-form input, #member-form button, #settings-form input, #settings-form button')
      .forEach((el) => { el.disabled = !state.canWrite; });
  }

  function renderAll() { renderSelects(); renderStandings(); renderLog(); renderMembers(); updatePreview(); applyWriteState(); }

  // ---------- 입력 폼 ----------
  const isDouble = () => $('t-double').checked;
  function syncType() {
    document.querySelectorAll('.dbl').forEach((s) => { s.hidden = !isDouble(); s.required = isDouble(); });
    updatePreview();
  }
  $('t-single').addEventListener('change', syncType);
  $('t-double').addEventListener('change', syncType);
  $('f-date').value = today();

  function readForm() {
    const teamA = [$('a1').value].concat(isDouble() ? [$('a2').value] : []);
    const teamB = [$('b1').value].concat(isDouble() ? [$('b2').value] : []);
    const all = teamA.concat(teamB);
    if (all.some((v) => !v)) throw new Error('모든 선수를 선택하세요.');
    if (new Set(all).size !== all.length) throw new Error('같은 선수를 두 번 선택할 수 없습니다.');
    const sets = R.parseScore($('f-score').value);
    const r = R.decideWinner(sets);
    if (!$('f-date').value) throw new Error('날짜를 입력하세요.');
    return { teamA, teamB, sets, r, date: $('f-date').value };
  }

  function updatePreview() {
    const p = $('preview');
    if (!$('f-score').value.trim()) { p.textContent = ''; p.className = 'preview'; return; }
    try {
      const f = readForm();
      const w = f.r.winner === 'A' ? f.teamA : f.teamB;
      p.textContent = `${teamName(w)} 승리 · 세트 ${Math.max(f.r.setsA, f.r.setsB)}-${Math.min(f.r.setsA, f.r.setsB)}`;
      p.className = 'preview ok';
    } catch (e) { p.textContent = e.message; p.className = 'preview err'; }
  }
  ['a1', 'a2', 'b1', 'b2', 'f-score', 'f-date'].forEach((id) => $(id).addEventListener('input', updatePreview));

  async function guarded(fn) {
    if (!state.db) { setStatus('공유 저장소에 연결되지 않아 저장할 수 없습니다. claude.ai에서 로그인한 상태로 열어 주세요.', true); return false; }
    try { await fn(); return true; }
    catch (e) {
      if (e && e.code === 'invalid_argument') {
        state.canWrite = false; applyWriteState(); renderLog(); renderMembers();
        setStatus('이 링크에서는 보기만 할 수 있습니다. 결과를 입력하려면 관리자에게 편집 권한을 요청하세요.', true);
      } else if (e && e.code === 'quota_exceeded') {
        setStatus('저장 공간이 가득 찼습니다. 오래된 경기 기록을 삭제한 뒤 다시 시도하세요.', true);
      } else {
        setStatus('저장하지 못했습니다. 잠시 후 다시 시도하세요. (' + ((e && e.message) || e) + ')', true);
      }
      return false;
    }
  }

  $('match-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    let f; try { f = readForm(); } catch (e) { updatePreview(); return; }
    $('save-btn').disabled = true;
    const ok = await guarded(() => state.db.collection('matches').add({
      date: f.date, teamA: f.teamA, teamB: f.teamB,
      sets: f.sets.map(([a, b]) => ({ a, b })),
      createdAt: Date.now(), createdBy: state.uid || null,
    }));
    $('save-btn').disabled = !state.canWrite;
    if (ok) {
      $('toast').textContent = `저장했습니다: ${teamName(f.teamA)} ${R.formatScore(f.sets)} ${teamName(f.teamB)}`;
      $('f-score').value = ''; updatePreview();
      setTimeout(() => { $('toast').textContent = ''; }, 4000);
    }
  });

  $('log-filter').addEventListener('change', renderLog);
  $('log').addEventListener('click', async (ev) => {
    const t = ev.target.closest('button'); if (!t) return;
    if (t.dataset.del) { state.pendingDelete = t.dataset.del; renderLog(); }
    else if (t.hasAttribute('data-del-cancel')) { state.pendingDelete = null; renderLog(); }
    else if (t.dataset.delConfirm) {
      const id = t.dataset.delConfirm; state.pendingDelete = null;
      await guarded(() => state.db.collection('matches').doc(id).delete());
    }
  });

  $('member-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const name = $('m-name').value.trim();
    if (!name) return;
    if (state.members.some((m) => m.name === name)) { setStatus(`“${name}” 멤버가 이미 있습니다.`, true); return; }
    if (await guarded(() => state.db.collection('members').add({ name, createdAt: Date.now() }))) { $('m-name').value = ''; setStatus(''); }
  });
  $('members').addEventListener('click', async (ev) => {
    const t = ev.target.closest('button[data-rm]'); if (!t) return;
    await guarded(() => state.db.collection('members').doc(t.dataset.rm).delete());
  });
  $('settings-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const winPoints = Number($('s-win').value), lossPoints = Number($('s-loss').value);
    if (!Number.isFinite(winPoints) || !Number.isFinite(lossPoints) || winPoints < lossPoints) {
      setStatus('승리 승점은 패배 승점보다 크거나 같아야 합니다.', true); return;
    }
    if (await guarded(() => state.db.doc('config/league').set({ winPoints, lossPoints }))) setStatus('승점 규칙을 저장했습니다.');
  });

  // ---------- 공유 저장소 연결 ----------
  renderAll(); syncType();
  async function resolveNames() {
    if (!state.user || !state.user.profiles) return;
    const ids = [...new Set(state.matches.map((m) => m.createdBy).filter(Boolean))];
    if (!ids.length) return;
    try {
      const ps = await state.user.profiles(ids);
      ids.forEach((id) => { if (ps && ps[id]) state.names[id] = ps[id].name || ''; });
      renderLog();
    } catch (e) {}
  }

  (async () => {
    if (!window.claude || !window.claude.use) {
      state.canWrite = false; state.loaded.members = state.loaded.matches = true; renderAll();
      setStatus('공유 저장소 없이 열렸습니다. claude.ai 링크로 열어야 결과를 함께 보고 입력할 수 있습니다.', true);
      return;
    }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    state.db = db; state.user = user;
    if (!db) {
      state.canWrite = false; state.loaded.members = state.loaded.matches = true; renderAll();
      setStatus('공유 저장소에 연결할 수 없습니다. claude.ai에 로그인한 상태로 링크를 열어 주세요.', true);
      return;
    }
    if (user) {
      try { state.uid = await user.id(); } catch (e) {}
      try { if (user.can && (await user.can('data.write')) === false) { state.canWrite = false; setStatus('보기 전용 권한입니다. 결과를 입력하려면 관리자에게 편집 권한을 요청하세요.'); } } catch (e) {}
    }
    const onErr = (e) => { if (e && e.code !== 'revoked') setStatus('실시간 갱신이 끊겼습니다. 페이지를 새로고침하세요.', true); };
    db.collection('members').onSnapshot((s) => {
      state.members = s.docs.map((d) => Object.assign({ id: d.id }, d.data()))
        .filter((m) => typeof m.name === 'string')
        .sort((a, b) => a.name.localeCompare(b.name, 'ko'));
      state.loaded.members = true; renderAll();
    }, onErr);
    db.collection('matches').onSnapshot((s) => {
      state.matches = s.docs.map((d) => {
        const x = d.data();
        return { id: d.id, date: x.date, createdAt: x.createdAt, createdBy: x.createdBy,
          teamA: Array.isArray(x.teamA) ? x.teamA : [], teamB: Array.isArray(x.teamB) ? x.teamB : [],
          sets: Array.isArray(x.sets) ? x.sets.map((v) => [Number(v.a), Number(v.b)]) : [] };
      }).filter((m) => m.teamA.length && m.teamB.length && m.sets.length);
      state.loaded.matches = true; renderAll(); resolveNames();
    }, onErr);
    db.doc('config/league').onSnapshot((d) => {
      const x = d.exists ? d.data() : {};
      state.settings = {
        winPoints: Number.isFinite(x.winPoints) ? x.winPoints : R.DEFAULT_SETTINGS.winPoints,
        lossPoints: Number.isFinite(x.lossPoints) ? x.lossPoints : R.DEFAULT_SETTINGS.lossPoints,
      };
      renderStandings(); renderMembers();
    }, onErr);
  })();
})();
</script>
